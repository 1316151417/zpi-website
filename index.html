  <template id="notes-zpi">
    <article><h3>按回车就发，不必先选模式。</h3><p>输入框默认连发送按钮都不显示。也不用先进入计划模式，或为每一步点批准。执行记录留下了读过的文件、改过的内容和命令输出，方便回看。桌面版的命令使用本机权限，建议从你信任的项目开始。</p></article>
    <article><h3>四个基础工具，能做什么看得见。</h3><p>基础提示词只交代助手的职责。批量调用工具、持续完成任务、只报必要进度、结论先行，这些工作约定和启用的工具都能在设置里查看，不必逛插件市场。</p><dl class="tools"><div><dt>基础 <b>4</b></dt><dd>读文件、执行命令、精确编辑、写文件</dd></div><div><dt>按需 <b>+1</b></dt><dd>向用户提问，等你做决定</dd></div><div><dt>按需 <b>+4</b></dt><dd>子智能体、消息、任务输出与停止；后两项与后台任务共用</dd></div><div><dt>按需 <b>+2</b></dt><dd>搜索网页、读取网页。内置工具全开共 11 个</dd></div></dl></article>
    <article><h3>换模型，不用换工作区。</h3><p>支持 OpenAI Chat Completions、Anthropic Messages 和 OpenAI Responses。启动时可从环境变量识别已配置的服务商。也可以登录 ChatGPT，使用订阅账号可用的模型。官方 Responses 连接可复用 WebSocket；连接不可用时回退到 HTTP SSE。</p></article>
    <article><h3>把反复用到的东西留下。</h3><p>用快捷键切换任务，把常用流程写成技能或命令。记忆留住跨任务的约定，归档收起已结束的对话，下次需要时还能找回来。</p></article>
  </template>
  <template id="notes-zpi-quick-chat">
    <article><h3>不用先把材料搬到聊天框。</h3><dl class="keys"><div><dt><kbd>⌥ Space</kbd></dt><dd>显示或隐藏浮窗，回到刚才的应用</dd></div><div><dt><kbd>⌥ ⇧ C</kbd></dt><dd>把当前应用的选中文字带入草稿</dd></div><div><dt><kbd>⌥ ⇧ V</kbd></dt><dd>带入剪贴板里的文字或图片</dd></div><div><dt><kbd>⌥ ⇧ A</kbd></dt><dd>框选屏幕，把截图带入草稿</dd></div></dl><p>⌥ 是 Option，⇧ 是 Shift。以上为 macOS 客户端快捷键；跨应用选区和截图需要相应的系统权限。</p></article>
    <article><h3>翻译一句话，或收拾一下下载目录。</h3><p>翻译时不用开工具。要查资料时打开联网；要整理文件、运行程序时，再打开本机工具。可拖动浮窗，也可以把回复固定在另一份文档旁。隐藏保留本次草稿，新建或退出就清空，不写进 ZPI 的任务历史。</p></article>
  </template>
  <template id="notes-zpi-agent-sdk"><article><h3>一条查询，读出最后的回复。</h3><pre class="example"><code>import { query } from '@zpi-dev/agent-sdk';

for await (const event of query({
  prompt: '只回复：你好，我是 zpi agent sdk。',
  options: { model: 'deepseek', tools: [], persistSession: false },
})) {
  if (event.type === 'result' &amp;&amp; event.subtype === 'success') {
    console.log(event.result);
  }
}</code></pre></article></template>
